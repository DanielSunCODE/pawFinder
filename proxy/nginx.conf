# Proxy (Proyecto 2): la ÚNICA puerta de entrada. El túnel de Cloudflare apunta aquí
# y aquí se reparte cada petición según su ruta:
#
#   /api/...  → backend del P1 (Express, puerto 3000). Se CONSERVA el prefijo /api,
#               porque el backend tiene todas sus rutas bajo /api.
#   /f/...    → servicio Elixir (puerto 4000). Se conserva el prefijo /f.
#   /...      → frontend (nginx con los archivos de Vite).
#
# Los destinos van en variables y se resuelven con el DNS interno de Docker (127.0.0.11)
# en cada petición. Así el proxy arranca aunque un servicio todavía no exista o esté
# caído: esa ruta responde 502 en lugar de que nginx no levante.
server {
  listen 80;

  # Fotos del registro (el backend acepta hasta IMAGE_MAX_BYTES).
  client_max_body_size 10m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend   http://backend:3000;
  set $funcional http://funcional:4000;
  set $frontend  http://frontend:80;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # Con una variable y sin ruta extra, nginx pasa la ruta completa tal cual (/api/..., /f/...).
  location /api/ {
    proxy_pass $backend;
  }

  location /f/ {
    proxy_pass $funcional;
  }

  location / {
    proxy_pass $frontend;
  }
}
