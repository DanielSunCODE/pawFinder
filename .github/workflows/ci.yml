name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint --workspace @pawfinder/backend
      - name: Verificacion de tipos
        run: npm run typecheck --workspace @pawfinder/backend
      - name: Pruebas
        run: npm run test --workspace @pawfinder/backend
      - name: Build
        run: npm run build --workspace @pawfinder/backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint --workspace @pawfinder/frontend
      - name: Verificacion de tipos
        run: npm run typecheck --workspace @pawfinder/frontend
      - name: Pruebas
        run: npm run test --workspace @pawfinder/frontend
      - name: Build
        run: npm run build --workspace @pawfinder/frontend
