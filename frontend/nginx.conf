# nginx DENTRO del contenedor del frontend: sólo sirve los archivos que generó Vite.
# (El reparto /api, /f y / lo hace el proxy: proxy/nginx.conf.)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash en el nombre: nunca cambian, se pueden guardar en caché mucho tiempo.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de React Router (/perritos/12, /registrar…): no son archivos, siempre se responde index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
